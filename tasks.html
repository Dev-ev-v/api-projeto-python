<!DOCTYPE html>
<html>
<head>
<title>Lista</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Seu gerenciador de tarefas pessoais está aqui</h1>
 <h2>No Tasks Manager, você pode criar e agendar tarefas, deixe sua vida mais produtiva agora mesmo!</h2>
<p id="msg"></p>
</header>
 <main>
 <input id="txt">
<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>
 </main>
<script>
const API = "https://guilhermepythonzaeg123.pythonanywhere.com"
const msg = document.getElementById("msg")
const txt = document.getElementById("txt")
const lista = document.getElementById("lista")

async function carregar(){
  const r = await fetch(API + "/tasks")

  const dados = await r.json()
  if (dados.success) {
  lista.innerHTML=""

  dados.forEach(t=>{
   lista.innerHTML += `<li>${t}</li>`
  })
 } 
 msg.innerHTML = `${dados.msg}`
}

async function add(){
 const texto = txt.value

 await fetch(API + "/tasks",{
  method:"POST",
  headers:{ "Content-Type":"application/json"},
  body: JSON.stringify({task:texto})
 })

 txt.value=""
 carregar()
}

carregar()
</script>
</body>
</html>
