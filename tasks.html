<!DOCTYPE html>
<html>
<head>
<title>Lista</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Seu gerenciador de tarefas pessoais está aqui</h1>
 <h2>No Tasks Manager, você pode criar e agendar tarefas, deixe sua vida mais produtiva agora mesmo!</h2>
<p id="msg"></p>
</header>
 <main>
 <input id="txt">
<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>
 </main>
<script>
const API = "https://guilhermepythonzaeg123.pythonanywhere.com"
const msg = document.getElementById("msg")
const txt = document.getElementById("txt")
const lista = document.getElementById("lista")

async function api(path, options={}){
 const headers = {
   "Content-Type":"application/json",
   ...(localStorage.token && {
     Authorization:"Bearer "+localStorage.token
   })
 }
 const r = await fetch(API+path,{
   ...options,
   headers
 })
 if(r.status === 401){
   localStorage.removeItem("token")
   window.location.href="index.html"
 }
 return r.json()
 }
 
async function carregar(){
  const dados = await api("/tasks",{method:"GET"})
  if (dados.success) {
  lista.innerHTML=""
  dados.tasks.forEach(t=>{
    const li = document.createElement("li")
    li.textContent = t
    lista.appendChild(li)
  })
  }
 msg.textContent = dados.msg
}

async function add(){
 const texto = txt.value
 await api("/tasks",{method:"POST",body:JSON.stringify({task:texto})})
 txt.value=""
 carregar()
}

carregar()
</script>
</body>
</html>
