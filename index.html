<!DOCTYPE html>
<html>
  <head>
   <link rel="stylesheet" href="style.css">
  </head>
  <body>
   <header>
    <h1>Seja bem vindo ao Tasks Manager</h1>
    <h2>Faça seu login para continuar</h2>
   </header>
    <main>
    <form method="POST" id="form">
<input id="User" placeholder="User">
 <input id="Password" placeholder="Password" type="Password">
<button type="submit">Entrar</button>
      <p id="msg"></p>
    </form>
      <button id="login">Entrar em conta já existente</button>
    </main>
    <script>      
      const user = document.getElementById("User")
      const password = document.getElementById("Password")
      const msg = document.getElementById("msg")
      const API = "https://guilhermepythonzaeg123.pythonanywhere.com"
      const login_btn = document.getElementById("login")
      const login_btn_text1 = "Entrar em conta já existente"
      const login_btn_text2 = "Criar uma nova conta"
      let mode = "/register"
      
      async function api(path, options = {}) {
 const headers = {
   "Content-Type":"application/json",
   ...(localStorage.token && {
     Authorization:"Bearer "+localStorage.token
   })
 }
 const r = await fetch(API + path, {
   ...options,
   headers
 })
 if(r.status === 401){
   localStorage.removeItem("token")
   window.location.href="index.html"
 }
 return r.json()
      }
      
      login_btn.addEventListener("click", () => {
if (login_btn.textContent == login_btn_text1) {
login_btn.textContent = login_btn_text2
  mode = "/login"
} else {
login_btn.textContent = login_btn_text1
  mode = "/register"
}
      })
      
      document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault()
        const dados = await api(mode,{method:"POST",body:JSON.stringify({user:user.value,password:password.value})})
  
  if(dados.success && dados.token){
        msg.textContent = dados.msg
    localStorage.token = dados.token
    window.location.href = "tasks.html"
  } else {
    msg.textContent = dados.msg
  }
})
    </script>
  </body>
</html>
