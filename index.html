<!DOCTYPE html>
<html>
  <head>
   <link rel="stylesheet" href="style.css">
  </head>
  <body>
   <header>
    <h1>Seja bem vindo ao Tasks Manager</h1>
    <h2>Faça seu login para continuar</h2>
   </header>
    <main>
    <form method="POST" id="form">
<input id="User" placeholder="User" required>
 <input id="Password" placeholder="Password" type="Password" required>
<button type="submit">Entrar</button>
      <p id="msg">Sua mensagem de login aparecerá aqui!</p>
    </form>
      <a href="https://dev-ev-v.github.io/api-projeto-python/">Entrar em conta já existente</a>
    </main>
    <script>
      const user = document.getElementById("User")
      const password = document.getElementById("Password")
      const msg = document.getElementById("msg")
      document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault()
        const resposta = await fetch("https://guilhermepythonzaeg123.pythonanywhere.com/register", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      user: user.value,
      password: password.value
    })
  })

  const dados = await resposta.json()
console.log(dados)
  if(dados.success){
    msg.textContent = `${dados.msg}`
    window.location.href = "tasks.html"
  } else {
    msg.textContent = `${dados.msg}`
  }
})
    </script>
  </body>
</html>
