<!DOCTYPE html>
<html>
<head>
<title>Lista</title>
</head>
<body>

<h1>Tarefas</h1>

<input id="txt">
<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<script>
const API = "https://guilhermezaeg123.pythonanywhere.com"

const txt = document.getElementById("txt")
const lista = document.getElementById("lista")

async function carregar(){
 try{
  const r = await fetch(API + "/tarefas")
  if(!r.ok) throw new Error(r.status)

  const dados = await r.json()
  lista.innerHTML=""

  dados.forEach(t=>{
   lista.innerHTML += `<li>${t}</li>`
  })
 }catch(e){
  console.error(e)
 }
}

async function add(){
 const texto = txt.value

 await fetch(API + "/tarefas",{
  method:"POST",
  headers:{ "Content-Type":"application/json"},
  body: JSON.stringify({tarefa:texto})
 })

 txt.value=""
 carregar()
}

carregar()
</script>
</body>
</html>
