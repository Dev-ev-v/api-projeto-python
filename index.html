<!DOCTYPE html>
<html>
<head>
<title>Lista</title>
</head>
<body>

<h1>Tarefas</h1>

<input id="txt">
<button onclick="add()">Adicionar</button>

<ul id="lista"></ul>

<script>
const API = "https://Guilhermezaeg123.pythonanywhere.com"
async function carregar(){
 let r = await fetch(API + "/tarefas")
 let dados = await r.json()

 lista.innerHTML=""
 dados.forEach(t=>{
  lista.innerHTML += "<li>"+t+"</li>"
 })
}

async function add(){
 let texto = txt.value

 await fetch(API + "/tarefas",{
  method:"POST",
  headers:{ "Content-Type":"application/json"},
  body: JSON.stringify({tarefa:texto})
 })

 txt.value=""
 carregar()
}

carregar()
</script>

</body>
</html>
