<!DOCTYPE html>
<html>
  <head>
   <link rel="stylesheet" href="style.css">
  </head>
  <body>
   <header>
    <h1>Seja bem vindo ao Tasks Manager</h1>
    <h2>Faça seu login para continuar</h2>
   </header>
    <main>
    <form method="POST" id="form">
<input id="User" placeholder="User" required>
 <input id="Password" placeholder="Password" type="Password" required>
<button type="submit">Entrar</button>
      <p id="msg">Sua mensagem de login aparecerá aqui!</p>
    </form>
      <button id="login"></button>
    </main>
    <script>
      const user = document.getElementById("User")
      const password = document.getElementById("Password")
      const msg = document.getElementById("msg")
      const API = "https://guilhermepythonzaeg123.pythonanywhere.com"
      const login_btn = document.getElementById("login")
      const login_btn_text1 = "Entrar em conta já existente"
      const login_btn_text2 = "Criar uma nova conta"
      login_btn.textContent = login_btn_text1
      let mode = "/register"
      login_btn.addEventListener("click", () => {
if (login_btn.textContent == login_btn_text1) {
login_btn.textContent = login_btn_text2
  mode = "/login"
} else {
login_btn.textContent = login_btn_text1
  mode = "/register"
}
      }
      document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault()
        const resposta = await fetch(API + mode, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
          body: JSON.stringify({
      user: user.value,
      password: password.value
    })
  })

  const dados = await resposta.json()
console.log(dados)
  if(dados.success){
    msg.textContent = `${dados.msg}`
    window.location.href = "tasks.html"
  } else {
    msg.textContent = `${dados.msg}`
  }
})
    </script>
  </body>
</html>
